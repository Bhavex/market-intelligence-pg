name: Publish research dataset

# Manual: exports the derived-measurement dataset (src/export_dataset.py) and publishes it as a
# GitHub release. If the repository is linked to Zenodo (zenodo.org -> GitHub -> switch the repo on),
# every release is archived there automatically and receives a citable DOI.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dataset:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export derived dataset (no raw prices)
        run: python src/export_dataset.py --out nse-free-data-quality
      - name: Package
        run: |
          zip -r nse-free-data-quality.zip nse-free-data-quality
          cp nse-free-data-quality/DATASHEET.md release-notes.md
      - name: Publish GitHub release
        run: |
          TAG="dataset-$(date -u +%Y-%m-%d)"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" nse-free-data-quality.zip \
            --title "Dataset: free end-of-day data quality for NSE stocks ($(date -u +%d\ %b\ %Y))" \
            --notes-file release-notes.md
