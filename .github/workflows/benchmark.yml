name: Weekly performance benchmark

on:
  schedule:
    - cron: "30 12 * * 0"     # Sunday 6:00 PM IST
  workflow_dispatch:

permissions:
  contents: write             # to commit docs/BENCHMARKS.md

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run EXPLAIN ANALYZE benchmarks
        run: python src/benchmark.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BENCHMARKS.md
          git diff --cached --quiet || git commit -m "Update benchmark results" && git push
