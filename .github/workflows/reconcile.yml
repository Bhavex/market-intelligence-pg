name: NSE bhavcopy reconciliation

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Most recent NSE trading sessions to reconcile"
        default: "5"
      date:
        description: "Reconcile one session instead, YYYY-MM-DD (empty = use days)"
        default: ""
      report_since:
        description: "Only report results already stored from this date, YYYY-MM-DD (downloads nothing)"
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DAYS: ${{ github.event.inputs.days || '5' }}
      ONE_DATE: ${{ github.event.inputs.date }}
      REPORT_SINCE: ${{ github.event.inputs.report_since }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply schema changes (safe, idempotent)
        run: python src/setup_db.py
      - name: Download bhavcopy files and reconcile with Yahoo
        shell: bash
        run: |
          if [ -n "$REPORT_SINCE" ]; then python src/reconcile.py --report-since "$REPORT_SINCE"
          elif [ -n "$ONE_DATE" ]; then python src/reconcile.py --date "$ONE_DATE"
          else python src/reconcile.py --days "$DAYS"; fi
