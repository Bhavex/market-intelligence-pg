name: Daily market update

# Three attempts per trading day, so a delayed or dropped GitHub schedule, or late
# Yahoo data, can't make us miss a day. Re-running is safe: every load is an UPSERT.
on:
  schedule:
    - cron: "40 11 * * 1-5"   # 5:10 PM IST  — first load after NSE close
    - cron: "40 14 * * 1-5"   # 8:10 PM IST  — retry (late data / delayed runs)
    - cron: "40 1 * * 2-6"    # 7:10 AM IST next day — final check: fails loudly if a day is missing
  workflow_dispatch:          # "Run workflow" button for manual runs

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRICT_FRESHNESS: ${{ github.event.schedule == '40 1 * * 2-6' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply schema changes (safe, idempotent)
        run: python src/setup_db.py
      - name: Fetch prices and refresh signals
        run: python src/daily_update.py
      - name: Official exchange closes for reconciliation (never blocks the load)
        run: python src/official_prices.py --days 5
        continue-on-error: true
      - name: Refresh reporting layer + data-quality checks
        run: python src/post_load.py
      - name: Verify 52-week signals
        run: python src/verify_52w.py
