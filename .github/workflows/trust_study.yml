name: Data trust study

# Weekly research job (sql/08-10, docs/TRUST.md):
#   1. re-download every stock's full history -> every Yahoo revision is versioned and classified
#   2. download the exchanges' official closes (NSE/BSE bhavcopy) for reconciliation
#   3. re-run the signal-fragility study and store the results
# The site is republished afterwards (site.yml listens for this workflow too).
on:
  schedule:
    - cron: "20 3 * * 0"      # Sunday 8:50 AM IST
  workflow_dispatch:
    inputs:
      official_days:
        description: "Sessions of official exchange files to check (already downloaded files are skipped)"
        default: "250"
      sims:
        description: "Repetitions of each simulated error scenario"
        default: "20"

concurrency:
  group: daily-update           # never runs at the same time as the daily load
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply schema changes (safe, idempotent)
        run: python src/setup_db.py
      - name: Research universe (NIFTY 50 + 25 small caps, from NSE's index files)
        run: python src/universe.py
        continue-on-error: true   # if NSE's list can't be downloaded, the universe simply stays as it is
      - name: Revision scan (full history re-download, versioned; also loads new stocks)
        run: python src/revision_scan.py
      - name: Official exchange closes (NSE/BSE)
        run: python src/official_prices.py --days ${{ github.event.inputs.official_days || '250' }}
        continue-on-error: true   # exchanges may block cloud servers; logged in reference_fetch_log
      - name: Second free feed (Yahoo BSE listing), about a year
        run: python src/alt_feed.py --days 400
        continue-on-error: true
      - name: Signal-fragility study
        run: python src/fragility.py --sims ${{ github.event.inputs.sims || '20' }}
      - name: Refresh reporting layer + data-quality checks
        run: python src/post_load.py
      - name: Summary
        run: python src/trust_report.py >> "$GITHUB_STEP_SUMMARY"
