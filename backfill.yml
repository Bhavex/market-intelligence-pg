name: One-time setup and backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Load history from this date"
        default: "2015-01-01"

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create tables, seed data, functions, views
        run: python src/setup_db.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Load price history and compute signals
        run: python src/backfill.py --start "${{ inputs.start }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Fundamentals snapshot
        run: python src/fundamentals.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
